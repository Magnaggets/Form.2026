/* Принудительное центрирование страницы авторизации */
body {
    margin: 0;
    min-height: 100vh;
}

.auth-page {
    width: 100%;
    min-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    box-sizing: border-box;
}

.auth-card {
    display: block;
    width: 100%;

    margin: 0 auto;

<body>

    <header class="header">

        <a href="/" class="logo">★ FORM</a>

        <a href="/" class="header-button">На главную</a>

    </header>

    <mains="auth-page">

        <section class="auth-card">

            <p class="subtitle">ТВОЙ ПУТЬ К СИЛЕ</p>

            <h1 id="formTitle">Войти в <span>FORM</span></h1>

            <p class="description" id="formDescription">

                Продолжай отслеживать свой прогресс.

            </p>

            <form id="authForm">

                <div id="nameField" hidden>

                    <label for="name">Имя</label>

                    <input

                        id="name"

                        type="text"

                        placeholder="Твоё имя"

                        autocomplete="name"

                    >

                </div>

                <label for="email">Электронная почта</label>

                <input

                    id="email"

                    type="email"

                    placeholder="name@example.com"

                    autocomplete="email"

                    required

                >

                <label for="password">Пароль</label>

                <input

                    id="password"

                    type="password"

                    placeholder="Минимум 6 символов"

                    minlength="6"

                    autocomplete="current-password"

                    required

                >

                <p id="message" role="status" aria-live="polite"></p>

                <button

                    class="start-button"

                    type="submit"

                    id="submitButton"

                >Войти</button>

            </form>

            <p class="auth-switch">

                <span id="switchText">Нет аккаунта?</span>

                <button

                    type="button"

                    id="switchButton"

                >Зарегистрироваться</button>

            </p>

        </section>

    </main>

    <script src="/auth.js"></script>

    <script>
    getCurrentUser()
        .then(user => {
            if (user) {
                window.location.replace("/cabinet.html");
            }
        })
        .catch(error => {
            console.error("Ошибка проверки авторизации:", error);
        });
</script>

    <script>

        const authForm = document.getElementById("authForm");

        const nameField = document.getElementById("nameField");

        const nameInput = document.getElementById("name");

        const emailInput = document.getElementById("email");

        const passwordInput = document.getElementById("password");

        const message = document.getElementById("message");

        const formTitle = document.getElementById("formTitle");

        const formDescription = document.getElementById("formDescription");

        const submitButton = document.getElementById("submitButton");

        const switchText = document.getElementById("switchText");

        const switchButton = document.getElementById("switchButton");

        let isRegister = false;

        let isSubmitting = false;

        function updateForm() {

            nameField.hidden = !isRegister;

            nameInput.required = isRegister;

            passwordInput.autocomplete = isRegister

                ? "new-password"

                : "current-password";

            formTitle.innerHTML = isRegister

                ? 'Создать <span>аккаунт</span>'

                : 'Войти в <span>FORM</span>';

            formDescription.textContent = isRegister

                ? "Создай аккаунт и начни свой путь."

                : "Продолжай отслеживать свой прогресс.";

            submitButton.textContent = isRegister

                ? "Зарегистрироваться"

                : "Войти";

            switchText.textContent = isRegister

                ? "Уже есть аккаунт?"

                : "Нет аккаунта?";

            switchButton.textContent = isRegister

                ? "Войти"

                : "Зарегистрироваться";

            message.textContent = "";

        }

        switchButton.addEventListener("click", () => {

            isRegister = !isRegister;

            updateForm();

        });

        authForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            if (isSubmitting) return;

            isSubmitting = true;

            submitButton.disabled = true;

            message.textContent = "";

            try{

                const data = {

                    email: emailInput.value.trim(),

                    password: passwordInput.value

                };

                const endpoint = isRegister

                    ? "/api/register"

                    : "/api/login";

                if (isRegister) {

                    data.name = nameInput.value.trim();

                }

                const response = await fetch(endpoint, {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    credentials: "same-origin",

                    body: JSON.stringify(data)

                });

                const result = await response.json();

                if (!response.ok) {

                    throw new Error(

                        result.message || "Не удалось выполнить запрос."

                    );

                }

                window.location.href = "/cabinet.html";

            } catch (error) {

                showMessage(

                    message,

                    error.message || "Не удалось связаться с сервером."

                );

            } finally {

                isSubmitting = false;

                submitButton.disabled = false;

            }

        });

        updateForm();

    </script>

</body>
